# Builds, tests and packages Switch Launcher on every push.
# Needs a macOS runner (SwiftUI/AppKit only build on macOS) registered with the
# `macos-arm64` label in host mode — see docs/CI.md.
name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  build:
    runs-on: macos-arm64
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Toolchain
        run: |
          sw_vers
          swift --version

      - name: Test
        run: swift test

      - name: Build and package
        run: ./scripts/build-app.sh --dist

      - name: Upload artifact
        uses: actions/upload-artifact@v3
        with:
          name: switch-launcher-${{ github.sha }}
          path: dist/*

      - name: Publish release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          API: ${{ github.server_url }}/api/v1/repos/${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          id=$(curl -fsS -X POST "$API/releases" \
            -H "Authorization: token $TOKEN" -H "Content-Type: application/json" \
            -d "{\"tag_name\":\"$TAG\",\"name\":\"Switch Launcher $TAG\",\"body\":\"See CHANGELOG.md\"}" \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["id"])')
          for f in dist/*; do
            curl -fsS -X POST "$API/releases/$id/assets?name=$(basename "$f")" \
              -H "Authorization: token $TOKEN" -F "attachment=@$f"
          done
