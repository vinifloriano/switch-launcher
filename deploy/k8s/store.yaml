# Game store: Versity S3 Gateway (POSIX backend) serving a plain folder on the TrueNAS.
# store-publish writes games straight into that folder over SMB (--to), so uploads never pass
# through a cluster node. The gateway only reads: the bucket folder is mounted read-only, and its
# own lock files go to a small writable folder in the pod.
#
# NAS folder: /mnt/MAIN/k8s-volumes/switch-store-games/switch-games
#   (SMB: //storage01/k8s-volumes/switch-store-games/switch-games)
# The launcher login comes from the `store-gateway` Secret (access, secret), created by
# deploy/setup-store.sh from ~/.config/switch-store/store.env.
apiVersion: v1
kind: Namespace
metadata:
  name: switch-store
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: store-gateway
  namespace: switch-store
spec:
  replicas: 1
  selector:
    matchLabels: { app: store-gateway }
  template:
    metadata:
      labels: { app: store-gateway }
    spec:
      # Downloads pass through this pod's node: keep it off k8s-worker3, whose USB NIC resets under
      # sustained load (docs/STORE.md).
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - { key: kubernetes.io/hostname, operator: NotIn, values: [k8s-worker3] }
      containers:
        - name: versitygw
          image: versity/versitygw:v1.10.0
          args: ["--port", ":8333", "posix", "--nometa", "/data"]
          env:
            - name: ROOT_ACCESS_KEY
              valueFrom: { secretKeyRef: { name: store-gateway, key: access } }
            - name: ROOT_SECRET_KEY
              valueFrom: { secretKeyRef: { name: store-gateway, key: secret } }
          ports: [{ containerPort: 8333 }]
          readinessProbe:
            tcpSocket: { port: 8333 }
            periodSeconds: 10
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { memory: 512Mi }
          volumeMounts:
            - { name: root, mountPath: /data }
            - { name: games, mountPath: /data/switch-games, readOnly: true }
      volumes:
        - name: root
          emptyDir: {}
        - name: games
          nfs: { server: 192.168.1.6, path: /mnt/MAIN/k8s-volumes/switch-store-games/switch-games, readOnly: true }
---
apiVersion: v1
kind: Service
metadata:
  name: store
  namespace: switch-store
spec:
  type: NodePort
  selector: { app: store-gateway }
  ports:
    - { name: s3, port: 8333, targetPort: 8333, nodePort: 30900 }
