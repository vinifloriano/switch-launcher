# Game store bucket: SeaweedFS (S3-compatible, single process) on the homelab cluster,
# data on the TrueNAS NFS class. Logins live in the `store-s3-config` Secret (s3.json),
# created by deploy/setup-store.sh.
apiVersion: v1
kind: Namespace
metadata:
  name: switch-store
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: minio-data   # name kept from the first deployment; holds the store's data
  namespace: switch-store
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: nfs-client
  resources:
    requests:
      storage: 600Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: seaweedfs
  namespace: switch-store
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels: { app: seaweedfs }
  template:
    metadata:
      labels: { app: seaweedfs }
    spec:
      containers:
        - name: seaweedfs
          image: chrislusf/seaweedfs:4.51
          args:
            - server
            - -dir=/data
            - -ip.bind=0.0.0.0
            - -volume.max=0
            - -master.volumeSizeLimitMB=30000
            - -s3
            - -s3.port=8333
            - -s3.config=/etc/seaweedfs/s3.json
          ports:
            - { name: s3, containerPort: 8333 }
          readinessProbe:
            tcpSocket: { port: 8333 }
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            tcpSocket: { port: 8333 }
            initialDelaySeconds: 60
            periodSeconds: 30
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { memory: 1536Mi }
          volumeMounts:
            - { name: data, mountPath: /data }
            - { name: s3-config, mountPath: /etc/seaweedfs, readOnly: true }
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: minio-data }
        - name: s3-config
          secret: { secretName: store-s3-config }
---
apiVersion: v1
kind: Service
metadata:
  name: store
  namespace: switch-store
spec:
  type: NodePort
  selector: { app: seaweedfs }
  ports:
    - { name: s3, port: 8333, targetPort: 8333, nodePort: 30900 }
